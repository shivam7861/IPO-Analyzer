<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPO Lens — AI-Powered RHP Analyzer</title>
  <meta name="description" content="Upload a Red Herring Prospectus and get an instant AI-powered investment analysis covering risk factors, financials, management, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & tokens ─────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #060810;
      --bg-2:         #0b0d1e;
      --card:         rgba(11, 14, 32, 0.82);
      --card-h:       rgba(16, 20, 48, 0.92);
      --border:       rgba(120, 130, 255, 0.14);
      --border-h:     rgba(120, 130, 255, 0.35);
      --text:         #eef0ff;
      --text-2:       rgba(190, 200, 255, 0.75);
      --text-3:       rgba(140, 155, 220, 0.5);
      --accent:       #7c83f5;
      --accent-glow:  rgba(124, 131, 245, 0.28);
      --green:        #34d399;
      --green-bg:     rgba(52, 211, 153, 0.12);
      --green-border: rgba(52, 211, 153, 0.30);
      --red:          #f87171;
      --red-bg:       rgba(248, 113, 113, 0.12);
      --red-border:   rgba(248, 113, 113, 0.30);
      --amber:        #fbbf24;
      --amber-bg:     rgba(251, 191, 36, 0.12);
      --amber-border: rgba(251, 191, 36, 0.30);
      --radius:       14px;
      --radius-lg:    20px;
      --shadow:       0 4px 32px rgba(0,0,0,0.5);
      --shadow-card:  0 2px 20px rgba(0,0,0,0.4);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background atmosphere ──────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 15% 10%,  rgba(99,102,241,0.09) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 85%,  rgba(52,211,153,0.06) 0%, transparent 55%),
        radial-gradient(ellipse 50% 60% at 50% 50%,  rgba(6,8,16,0) 0%,       var(--bg) 100%);
    }

    /* ── Layout ─────────────────────────────────────────────────────── */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 56px 24px 40px;
      position: relative; z-index: 1;
    }
    .logo {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--accent); margin-bottom: 20px;
      border: 1px solid var(--accent-glow);
      padding: 6px 16px; border-radius: 999px;
      background: rgba(124,131,245,0.07);
    }
    .logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(0.7)} }

    h1 {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #eef0ff 30%, #7c83f5 70%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
    }
    .tagline {
      font-size: 1.1rem; font-weight: 400; color: var(--text-2); max-width: 520px; margin: 0 auto;
    }

    /* ── Upload section ─────────────────────────────────────────────── */
    #upload-section { padding: 0 0 60px; }

    .upload-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 36px;
      box-shadow: var(--shadow);
      max-width: 680px;
      margin: 0 auto;
    }

    /* API key row */
    .api-row {
      display: flex; gap: 12px; margin-bottom: 24px; align-items: center;
    }
    .api-row label { font-size: 13px; color: var(--text-2); white-space: nowrap; font-weight: 500; }
    .api-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .api-input::placeholder { color: var(--text-3); }
    .api-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 52px 24px;
      text-align: center;
      cursor: pointer;
      transition: all .25s;
      position: relative;
      overflow: hidden;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(124,131,245,0.05);
    }
    #drop-zone .drop-icon { font-size: 3rem; margin-bottom: 14px; display: block; }
    #drop-zone .drop-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    #drop-zone .drop-sub { font-size: 0.88rem; color: var(--text-3); }
    #drop-zone .drop-badge {
      display: inline-block; margin-top: 14px;
      background: rgba(124,131,245,0.1); border: 1px solid var(--accent-glow);
      border-radius: 999px; padding: 4px 12px; font-size: 11px; color: var(--accent); font-weight: 600;
    }
    #file-input { display: none; }

    /* File selected state */
    #file-info {
      display: none; margin-top: 18px;
      background: rgba(52,211,153,0.07);
      border: 1px solid var(--green-border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    #file-info.hidden { display: none !important; }
    .file-icon { font-size: 1.5rem; }
    .file-details { flex: 1; }
    .file-name { font-size: 14px; font-weight: 600; color: var(--green); }
    .file-size { font-size: 12px; color: var(--text-3); }
    .file-remove { cursor: pointer; color: var(--text-3); font-size: 1.1rem; transition: color .2s; }
    .file-remove:hover { color: var(--red); }

    /* Analyze button */
    #analyze-btn {
      width: 100%; margin-top: 20px;
      background: linear-gradient(135deg, #6366f1, #7c83f5);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 16px;
      font-size: 1rem; font-weight: 700; font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .3px;
      position: relative; overflow: hidden;
    }
    #analyze-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 32px rgba(99,102,241,0.45);
    }
    #analyze-btn:active { transform: translateY(0); }
    #analyze-btn:disabled { opacity: .5; cursor: not-allowed; }
    #analyze-btn .btn-shimmer {
      position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      animation: shimmer 2.4s infinite;
    }
    @keyframes shimmer { to { left: 150%; } }

    /* ── Analysis section ───────────────────────────────────────────── */
    #analysis-section { display: none; padding-bottom: 80px; }

    /* Status bar */
    .status-bar {
      max-width: 680px; margin: 0 auto 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      backdrop-filter: blur(12px);
    }
    .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .status-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
    .status-count { font-size: 13px; font-weight: 700; color: var(--accent); }
    .progress-track {
      height: 6px; border-radius: 999px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #6366f1, #34d399);
      transition: width .6s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }
    #status-message {
      margin-top: 12px; font-size: 13px; color: var(--text-2);
      min-height: 1.4em;
    }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(124,131,245,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Company name banner */
    #company-banner {
      display: none;
      text-align: center; margin-bottom: 28px;
      font-size: 1.05rem; font-weight: 600; color: var(--text-2);
    }
    #company-banner span { color: var(--text); font-weight: 800; }

    /* ── Section cards grid ─────────────────────────────────────────── */
    #sections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(14px);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      opacity: 0;
      transform: translateY(20px);
      animation: card-in .5s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes card-in { to { opacity: 1; transform: translateY(0); } }

    .card-header {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }
    .card-icon { font-size: 1.5rem; }
    .card-label { font-size: 1rem; font-weight: 700; flex: 1; }
    .card-score {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800;
      border: 2px solid;
      flex-shrink: 0;
      transition: all .4s;
    }
    .score-high   { color: var(--green); border-color: var(--green); background: var(--green-bg); }
    .score-mid    { color: var(--amber); border-color: var(--amber); background: var(--amber-bg); }
    .score-low    { color: var(--red);   border-color: var(--red);   background: var(--red-bg);   }

    /* Loading state for card */
    .card-loading {
      display: flex; align-items: center; gap: 10px;
      padding: 24px 20px;
      color: var(--text-3); font-size: 14px;
    }

    .card-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

    .card-summary { font-size: 14px; line-height: 1.65; color: var(--text-2); }

    .tag-group { display: flex; flex-direction: column; gap: 6px; }
    .tag-group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
      font-weight: 500; line-height: 1.4;
    }
    .tag-green  { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
    .tag-red    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
    .tag-amber  { background: var(--amber-bg);  color: var(--amber);  border: 1px solid var(--amber-border); }

    .analyst-note {
      background: rgba(124,131,245,0.06);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 10px 14px;
      font-size: 13px; font-style: italic; color: var(--text-2);
      line-height: 1.6;
    }

    /* ── Final verdict ───────────────────────────────────────────────── */
    #verdict-panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(16px);
      overflow: hidden;
      box-shadow: var(--shadow);
      opacity: 0;
      animation: card-in .6s .1s cubic-bezier(.4,0,.2,1) forwards;
    }

    .verdict-header {
      padding: 40px 40px 28px;
      text-align: center;
      position: relative;
    }
    .verdict-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text-3); margin-bottom: 20px; }

    .verdict-badge {
      display: inline-block;
      font-size: 2.4rem; font-weight: 900;
      letter-spacing: -1px;
      padding: 16px 48px;
      border-radius: 999px;
      border: 2px solid;
      margin-bottom: 16px;
      animation: badge-pulse 2.5s infinite;
      position: relative;
    }
    .verdict-INVEST { color: var(--green); border-color: var(--green); background: var(--green-bg); }
    .verdict-AVOID  { color: var(--red);   border-color: var(--red);   background: var(--red-bg); }
    .verdict-CAUTION{ color: var(--amber); border-color: var(--amber); background: var(--amber-bg); }
    @keyframes badge-pulse { 0%,100%{box-shadow:0 0 0 0 transparent} 50%{box-shadow:0 0 20px 4px var(--glow-color, rgba(52,211,153,.2))} }

    .verdict-score { font-size: 1rem; color: var(--text-2); margin-bottom: 10px; }
    .verdict-score strong { font-size: 2rem; font-weight: 800; color: var(--text); margin-right: 4px; }

    .verdict-one-liner {
      font-size: 1.05rem; font-weight: 500; color: var(--text-2);
      max-width: 600px; margin: 12px auto 0;
      font-style: italic; line-height: 1.6;
    }

    .verdict-body { padding: 0 40px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }

    .verdict-col h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); margin-bottom: 14px; }
    .verdict-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .verdict-col li { font-size: 14px; line-height: 1.55; color: var(--text-2); display: flex; gap: 8px; }
    .verdict-col li::before { flex-shrink: 0; font-size: 13px; margin-top: 2px; }
    .strengths li::before { content: '✅'; }
    .weaknesses li::before { content: '❌'; }

    /* Score grid in verdict */
    .score-grid {
      padding: 0 40px 28px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .score-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .score-item-icon { font-size: 1.2rem; display: block; margin-bottom: 4px; }
    .score-item-label { font-size: 11px; color: var(--text-3); margin-bottom: 6px; font-weight: 500; }
    .score-item-bar { height: 5px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden; margin-bottom: 4px; }
    .score-item-fill { height: 100%; border-radius: 999px; transition: width .8s .3s cubic-bezier(.4,0,.2,1); }
    .score-item-val { font-size: 16px; font-weight: 800; }

    .verdict-recommend {
      padding: 0 40px 28px;
      background: rgba(124,131,245,0.04);
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }
    .verdict-recommend h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); margin-bottom: 10px; }
    .verdict-recommend p { font-size: 14px; color: var(--text-2); line-height: 1.7; }

    /* Monitorables */
    .monitorables { padding: 0 40px 40px; }
    .monitorables h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); margin-bottom: 12px; }
    .monitorables ul { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
    .monitorables li { background: rgba(124,131,245,0.07); border: 1px solid var(--accent-glow); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--accent); font-weight: 500; }

    /* ── Error / messages ───────────────────────────────────────────── */
    .error-toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--red-bg); border: 1px solid var(--red-border);
      border-radius: var(--radius); padding: 14px 18px;
      color: var(--red); font-size: 14px; max-width: 380px;
      box-shadow: var(--shadow); display: none;
    }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      #sections-grid { grid-template-columns: 1fr; }
      .verdict-body  { grid-template-columns: 1fr; }
      .verdict-header, .verdict-body, .score-grid, .verdict-recommend, .monitorables { padding-left: 20px; padding-right: 20px; }
      h1 { font-size: 2rem; }
    }

    /* ── Utilities ──────────────────────────────────────────────────── */
    .hidden { display: none !important; }
    .mt-8 { margin-top: 8px; }
    .divider { height: 1px; background: var(--border); margin: 8px 0; }
  </style>
</head>

<body>
  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header>
    <div class="logo"><span class="logo-dot"></span> IPO Lens</div>
    <h1>AI-Powered RHP Analyzer</h1>
    <p class="tagline">Drop an RHP and get a deep, section-by-section investment analysis powered by Groq's LLM.</p>
  </header>

  <!-- ── Upload Section ───────────────────────────────────────────────────── -->
  <section id="upload-section">
    <div class="container">
      <div class="upload-card">

        <!-- API Key -->
        <div class="api-row">
          <label for="groq-key">🔑 Groq API Key</label>
          <input
            type="password"
            id="groq-key"
            class="api-input"
            placeholder="gsk_… (or set GROQ_API_KEY in .env)"
            autocomplete="off"
          />
        </div>

        <!-- Drop Zone -->
        <div id="drop-zone" role="button" aria-label="Upload RHP PDF" tabindex="0">
          <span class="drop-icon">📄</span>
          <div class="drop-title">Drop your RHP PDF here</div>
          <div class="drop-sub">or click to browse</div>
          <span class="drop-badge">PDF up to 500 pages</span>
          <input type="file" id="file-input" accept=".pdf" />
        </div>

        <!-- Selected file info -->
        <div id="file-info" class="hidden">
          <span class="file-icon">📄</span>
          <div class="file-details">
            <div class="file-name" id="file-name-display">—</div>
            <div class="file-size" id="file-size-display">—</div>
          </div>
          <span class="file-remove" id="file-remove" title="Remove file">✕</span>
        </div>

        <!-- Analyze button -->
        <button id="analyze-btn" disabled>
          <span class="btn-shimmer"></span>
          🚀 Analyze IPO
        </button>

      </div>
    </div>
  </section>

  <!-- ── Analysis Section ────────────────────────────────────────────────── -->
  <section id="analysis-section">
    <div class="container">

      <!-- Progress bar -->
      <div class="status-bar">
        <div class="status-header">
          <span class="status-label" id="status-label">Preparing…</span>
          <span class="status-count" id="status-count">0 / 7</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div id="status-message"><span class="spinner"></span> Starting analysis…</div>
      </div>

      <!-- Company name -->
      <div id="company-banner"></div>

      <!-- Section cards -->
      <div id="sections-grid"></div>

      <!-- Final verdict -->
      <div id="verdict-panel"></div>

    </div>
  </section>

  <!-- Error toast -->
  <div class="error-toast" id="error-toast"></div>

  <script>
    // ── State ────────────────────────────────────────────────────────────────
    let selectedFile = null;
    let currentTaskId = null;
    let sectionsCompleted = 0;
    const TOTAL_SECTIONS = 7;

    // ── DOM ──────────────────────────────────────────────────────────────────
    const dropZone       = document.getElementById('drop-zone');
    const fileInput      = document.getElementById('file-input');
    const fileInfo       = document.getElementById('file-info');
    const fileNameDisp   = document.getElementById('file-name-display');
    const fileSizeDisp   = document.getElementById('file-size-display');
    const fileRemove     = document.getElementById('file-remove');
    const analyzeBtn     = document.getElementById('analyze-btn');
    const groqKeyInput   = document.getElementById('groq-key');
    const uploadSection  = document.getElementById('upload-section');
    const analysisSection= document.getElementById('analysis-section');
    const sectionsGrid   = document.getElementById('sections-grid');
    const verdictPanel   = document.getElementById('verdict-panel');
    const progressFill   = document.getElementById('progress-fill');
    const statusLabel    = document.getElementById('status-label');
    const statusCount    = document.getElementById('status-count');
    const statusMessage  = document.getElementById('status-message');
    const companyBanner  = document.getElementById('company-banner');
    const errorToast     = document.getElementById('error-toast');

    // ── File selection ───────────────────────────────────────────────────────
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f && f.type === 'application/pdf') setFile(f);
      else showError('Please drop a PDF file.');
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    fileRemove.addEventListener('click', () => { clearFile(); });

    function setFile(f) {
      selectedFile = f;
      fileNameDisp.textContent = f.name;
      fileSizeDisp.textContent = formatBytes(f.size);
      fileInfo.classList.remove('hidden');
      analyzeBtn.disabled = false;
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = '';
      fileInfo.classList.add('hidden');
      analyzeBtn.disabled = true;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    // ── Start analysis ───────────────────────────────────────────────────────
    analyzeBtn.addEventListener('click', startAnalysis);

    async function startAnalysis() {
      if (!selectedFile) return;

      const groqKey = groqKeyInput.value.trim();

      // Upload the PDF
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = '⏳ Uploading…';

      const formData = new FormData();
      formData.append('file', selectedFile);

      let taskId;
      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: formData });
        if (!resp.ok) throw new Error((await resp.json()).detail || 'Upload failed');
        const data = await resp.json();
        taskId = data.task_id;
      } catch (err) {
        showError('Upload failed: ' + err.message);
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = '<span class="btn-shimmer"></span>🚀 Analyze IPO';
        return;
      }

      currentTaskId = taskId;
      sectionsCompleted = 0;

      // Switch to analysis view
      uploadSection.style.display = 'none';
      analysisSection.style.display = 'block';
      analysisSection.scrollIntoView({ behavior: 'smooth' });

      // Start SSE stream
      const streamUrl = `/api/stream/${taskId}${groqKey ? '?groq_key=' + encodeURIComponent(groqKey) : ''}`;
      const es = new EventSource(streamUrl);

      es.addEventListener('progress', e => {
        const d = JSON.parse(e.data);
        setStatus(d.message);
        if (d.company_name && d.company_name !== 'Unknown Company') {
          companyBanner.innerHTML = `Analyzing: <span>${escHtml(d.company_name)}</span>`;
          companyBanner.style.display = 'block';
        }
      });

      es.addEventListener('section_start', e => {
        const d = JSON.parse(e.data);
        setStatus(`<span class="spinner"></span> Analyzing ${d.icon} ${d.label}…`);
        addSectionCardLoading(d);
      });

      es.addEventListener('section_complete', e => {
        const d = JSON.parse(e.data);
        sectionsCompleted++;
        updateProgress(sectionsCompleted);
        updateSectionCard(d);
      });

      es.addEventListener('verdict_start', e => {
        setStatus('<span class="spinner"></span> Synthesizing final investment verdict…');
        statusLabel.textContent = 'Almost done!';
      });

      es.addEventListener('verdict_complete', e => {
        const d = JSON.parse(e.data);
        updateProgress(TOTAL_SECTIONS, true);
        setStatus('✅ Analysis complete!');
        statusLabel.textContent = 'Done';
        renderVerdict(d);
        es.close();
      });

      es.addEventListener('error', e => {
        try {
          const d = JSON.parse(e.data);
          showError(d.message);
        } catch (_) {}
        es.close();
      });

      es.onerror = () => {
        // Connection closed normally or error
      };
    }

    // ── Progress helpers ─────────────────────────────────────────────────────
    function setStatus(html) { statusMessage.innerHTML = html; }

    function updateProgress(n, done = false) {
      const pct = done ? 100 : Math.round((n / TOTAL_SECTIONS) * 90);
      progressFill.style.width = pct + '%';
      statusCount.textContent = `${n} / ${TOTAL_SECTIONS}`;
      if (!done) statusLabel.textContent = `Analyzing sections…`;
    }

    // ── Section cards ────────────────────────────────────────────────────────
    function addSectionCardLoading(d) {
      const el = document.createElement('div');
      el.className = 'section-card';
      el.id = `card-${d.key}`;
      el.innerHTML = `
        <div class="card-header">
          <span class="card-icon">${d.icon}</span>
          <span class="card-label">${escHtml(d.label)}</span>
          <div class="card-score" style="border-color:rgba(120,130,255,0.2); color:var(--text-3)">—</div>
        </div>
        <div class="card-loading" id="loading-${d.key}">
          <span class="spinner"></span> Analyzing with Groq…
        </div>
      `;
      sectionsGrid.appendChild(el);
    }

    function updateSectionCard(d) {
      const el = document.getElementById(`card-${d.section_key}`);
      if (!el) return;

      const score  = d.score ?? 5;
      const scoreClass = score >= 7 ? 'score-high' : score >= 4 ? 'score-mid' : 'score-low';

      const posTagsHtml = tagsHtml(d.positives || [], 'tag-green');
      const negTagsHtml = tagsHtml(d.negatives || [], 'tag-red');
      const rfTagsHtml  = tagsHtml(d.red_flags  || [], 'tag-amber');

      el.innerHTML = `
        <div class="card-header">
          <span class="card-icon">${d.icon || ''}</span>
          <span class="card-label">${escHtml(d.label || d.section_key)}</span>
          <div class="card-score ${scoreClass}">${score}</div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escHtml(d.summary || '')}</p>
          ${posTagsHtml ? `<div class="tag-group"><div class="tag-group-label">✅ Positives</div><div class="tags">${posTagsHtml}</div></div>` : ''}
          ${negTagsHtml ? `<div class="tag-group"><div class="tag-group-label">❌ Concerns</div><div class="tags">${negTagsHtml}</div></div>` : ''}
          ${rfTagsHtml  ? `<div class="tag-group"><div class="tag-group-label">🚨 Red Flags</div><div class="tags">${rfTagsHtml}</div></div>` : ''}
          ${d.analyst_note ? `<div class="analyst-note">${escHtml(d.analyst_note)}</div>` : ''}
        </div>
      `;
    }

    function tagsHtml(arr, cls) {
      if (!arr || !arr.length) return '';
      return arr.map(t => `<span class="tag ${cls}">${escHtml(String(t))}</span>`).join('');
    }

    // ── Final verdict ────────────────────────────────────────────────────────
    const SECTION_META = {
      objects_of_issue: { icon: '🎯', label: 'Objects' },
      risk_factors:     { icon: '⚠️', label: 'Risks' },
      industry_overview:{ icon: '🏭', label: 'Industry' },
      business:         { icon: '🏢', label: 'Business' },
      financials:       { icon: '📊', label: 'Financials' },
      related_party:    { icon: '🔗', label: 'Related Party' },
      management:       { icon: '👤', label: 'Management' },
    };

    function renderVerdict(d) {
      const verdict  = d.verdict || 'CAUTION';
      const score    = d.overall_score ?? 5;
      const summary  = d.verdict_summary || '';
      const oneLiner = d.one_liner || '';
      const strengths  = d.top_strengths  || [];
      const weaknesses = d.top_weaknesses || [];
      const monitorables = d.key_monitorables || [];
      const sectionScores= d.section_scores  || {};

      const verdictEmoji = verdict === 'INVEST' ? '🟢' : verdict === 'AVOID' ? '🔴' : '🟡';
      const glowColor    = verdict === 'INVEST' ? 'rgba(52,211,153,.25)' : verdict === 'AVOID' ? 'rgba(248,113,113,.25)' : 'rgba(251,191,36,.25)';

      // Score bar items
      const scoreItems = Object.entries(SECTION_META).map(([key, meta]) => {
        const s = sectionScores[key] ?? 5;
        const fillColor = s >= 7 ? 'var(--green)' : s >= 4 ? 'var(--amber)' : 'var(--red)';
        const textColor = s >= 7 ? 'var(--green)' : s >= 4 ? 'var(--amber)' : 'var(--red)';
        return `
          <div class="score-item">
            <span class="score-item-icon">${meta.icon}</span>
            <div class="score-item-label">${meta.label}</div>
            <div class="score-item-bar">
              <div class="score-item-fill" style="width:${s*10}%; background:${fillColor}"></div>
            </div>
            <div class="score-item-val" style="color:${textColor}">${s}</div>
          </div>
        `;
      }).join('');

      const strengthsList  = strengths.map(s  => `<li>${escHtml(s)}</li>`).join('');
      const weaknessesList = weaknesses.map(w => `<li>${escHtml(w)}</li>`).join('');

      const monitorHtml = monitorables.length
        ? `<div class="monitorables"><h3>📌 Post-listing Monitorables</h3><ul>${monitorables.map(m => `<li>${escHtml(m)}</li>`).join('')}</ul></div>`
        : '';

      verdictPanel.innerHTML = `
        <div class="verdict-header">
          <div class="verdict-label">Final Investment Verdict</div>
          <div class="verdict-badge verdict-${verdict}" style="--glow-color:${glowColor}">
            ${verdictEmoji} ${verdict}
          </div>
          <div class="verdict-score"><strong>${score}</strong> / 10</div>
          ${oneLiner ? `<div class="verdict-one-liner">"${escHtml(oneLiner)}"</div>` : ''}
        </div>

        <div class="score-grid">${scoreItems}</div>

        <div class="verdict-body">
          <div class="verdict-col strengths">
            <h3>💪 Top Strengths</h3>
            <ul>${strengthsList}</ul>
          </div>
          <div class="verdict-col weaknesses">
            <h3>⚡ Key Weaknesses</h3>
            <ul>${weaknessesList}</ul>
          </div>
        </div>

        ${summary ? `
        <div class="verdict-recommend">
          <h3>📝 Analyst Recommendation</h3>
          <p>${escHtml(summary)}</p>
          ${d.ideal_investor ? `<p class="mt-8" style="color:var(--text-3);font-size:13px;">Ideal for: ${escHtml(d.ideal_investor)}</p>` : ''}
          ${d.avoid_if ? `<p style="color:var(--red);font-size:13px;">Avoid if: ${escHtml(d.avoid_if)}</p>` : ''}
        </div>` : ''}

        ${monitorHtml}
      `;

      verdictPanel.style.display = 'block';
      verdictPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── Error handling ───────────────────────────────────────────────────────
    function showError(msg) {
      errorToast.textContent = '⚠️ ' + msg;
      errorToast.style.display = 'block';
      setTimeout(() => { errorToast.style.display = 'none'; }, 7000);
    }

    // ── Utils ────────────────────────────────────────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
